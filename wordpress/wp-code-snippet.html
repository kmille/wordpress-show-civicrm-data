<link rel="stylesheet" href="https://civi-api-exporter.omasforfuture.de/static/leaflet.css">
<style>
  #o4f-karte { height: 600px; width: 100%; max-width: 100%; position: relative; z-index: 0; }
  #o4f-karte .leaflet-container img,
  #o4f-karte .leaflet-tile { max-width: none !important; max-height: none !important; }
  #o4f-karte .count-marker {
    background: #4f7a00; color: #fff; border: 2px solid #fff; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font: 700 14px/1 system-ui, sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,.4);
  }
  #o4f-karte .info {
    background: rgba(255,255,255,.92); padding: 6px 10px; border-radius: 4px;
    font: 13px system-ui, sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,.25);
  }
</style>

<div id="o4f-karte"></div>

<script src="https://civi-api-exporter.omasforfuture.de/static/leaflet.js"></script>
<script>
(function () {
  const DATA_URL = 'https://civi-api-exporter.omasforfuture.de/api/v1/vorleseorte';

  var map = L.map('o4f-karte', { scrollWheelZoom: false }).setView([51.1, 10.4], 6);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-Mitwirkende'
  }).addTo(map);

  var size = function (n) { return Math.round(Math.min(26 + Math.sqrt(n) * 6, 64)); };

  function render(data) {
    var layer = L.geoJSON(data, {
      pointToLayer: function (f, latlng) {
        var s = size(f.properties.anzahl);
        return L.marker(latlng, {
          title: f.properties.ort,
          icon: L.divIcon({ className: 'count-marker', html: String(f.properties.anzahl), iconSize: [s, s] })
        });
      },
      onEachFeature: function (f, l) {
        var n = f.properties.anzahl;
        l.bindPopup('<b>' + f.properties.ort + '</b><br>' + n + (n === 1 ? ' Vorlesung' : ' Vorlesungen'));
      }
    }).addTo(map);
    map.fitBounds(layer.getBounds().pad(0.1));

    var total = data.features.reduce(function (s, f) { return s + f.properties.anzahl; }, 0);
    var box = L.control({ position: 'bottomleft' });
    box.onAdd = function () {
      var d = L.DomUtil.create('div', 'info');
      d.textContent = total + ' Vorlesungen an ' + data.features.length + ' Orten';
      return d;
    };
    box.addTo(map);
  }

  fetch(DATA_URL).then(function (r) { return r.json(); }).then(render);
})();
</script>
